[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackingquick"
version = "0.1.0"
description = "Small CPU research prototype for single-drone tracking"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<6", "onnxruntime>=1.20,<2", "pillow>=11"]

[project.optional-dependencies]
research = ["pytest>=8", "matplotlib>=3.9", "reportlab>=4", "pypdfium2>=4"]

[project.scripts]
trackingquick = "trackingquick.experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
